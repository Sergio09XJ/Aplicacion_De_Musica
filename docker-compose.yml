
services:

  postgres:
    image: postgres:16
    container_name: music-postgres
    restart: unless-stopped
    
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: music_dev_password
      POSTGRES_DB: musica
      
    ports:
      - "5432:5432"
      
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/database

  pgadmin:
    image: dpage/pgadmin4
    container_name: music-pgadmin
    restart: unless-stopped
    
    environment:
      PGADMIN_DEFAULT_EMAIL: sergiodanielac9@gmail.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin_dev_password
      
    ports:
      - "5050:80"
      
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  app-builder:
    build: .
    container_name: music-app-builder
    volumes:
      - .:/workspace
      
    depends_on:
      - postgres
    command: tail -f /dev/null

volumes:
  postgres_data:
    external: true
    name: proyectomusica_postgres_data

  pgadmin_data:
    external: true
    name: proyectomusica_pgadmin_data
